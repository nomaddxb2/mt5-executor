name: mt5-warm

on:
  repository_dispatch:
    types: [mt5-warm, mt5-job]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: mt5-warm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache MetaTrader 5 terminal
        id: mt5-cache
        uses: actions/cache@v4
        with:
          path: C:\mt5
          key: mt5-exness-6314

      - name: Install MetaTrader 5
        if: steps.mt5-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'exness5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          $roots = @('C:\Program Files', 'C:\Program Files (x86)', (Join-Path $env:LOCALAPPDATA 'Programs'))
          $src = $null
          for ($i = 0; $i -lt 45 -and -not $src; $i++) {
            $src = Get-ChildItem -Path $roots -Recurse -Depth 3 -Filter 'terminal64.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $src) { Start-Sleep -Seconds 2 }
          }
          if (-not $src) {
            Get-ChildItem 'C:\Program Files' -Directory | Select-Object -ExpandProperty FullName
            throw 'Exness MetaTrader 5 installation did not produce terminal64.exe'
          }
          $dir = $src.Directory.FullName
          Write-Host "found terminal at $dir"
          New-Item -ItemType Directory -Force -Path 'C:\mt5' | Out-Null
          Copy-Item (Join-Path $dir '*') 'C:\mt5' -Recurse -Force
          Get-Item 'C:\mt5\terminal64.exe' | Select-Object FullName, Length
          Get-Item 'C:\mt5\config\servers.dat' -ErrorAction SilentlyContinue | Select-Object Name, Length
          Get-Content 'C:\mt5\origin.txt' -ErrorAction SilentlyContinue

      - name: Verify terminal
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\mt5\terminal64.exe')) { throw 'C:\mt5\terminal64.exe is missing' }
          python -c "import MetaTrader5 as mt5; print('MetaTrader5', mt5.__version__)"

      - name: Diagnose MT5 IPC
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: python mt5_diag.py

      - name: Run warm worker
        shell: pwsh
        env:
          MT5_API_URL: ${{ secrets.MT5_API_URL }}
          MT5_WORKER_SECRET: ${{ secrets.MT5_WORKER_SECRET }}
          MT5_WORKER_ID: github-${{ github.run_id }}
          MT5_SHARD: ${{ vars.MT5_SHARD || '0' }}
          MT5_SHARDS: ${{ vars.MT5_SHARDS || '1' }}
          MT5_DURATION_SECONDS: '20700'
          MT5_SUPABASE_URL: ${{ secrets.MT5_SUPABASE_URL }}
          MT5_SUPABASE_KEY: ${{ secrets.MT5_SUPABASE_KEY }}
          MT5_DRY_RUN: ${{ vars.MT5_DRY_RUN || '0' }}
        run: python mt5_worker.py

      - name: Chain next warm run
        if: ${{ always() && vars.MT5_WARM_ENABLED != 'false' }}
        shell: pwsh
        env:
          MT5_DISPATCH_TOKEN: ${{ secrets.MT5_DISPATCH_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:MT5_DISPATCH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          $body = @{ event_type = 'mt5-warm' } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/dispatches" -Headers $headers -Body $body -ContentType 'application/json'
