name: mt5-warm

on:
  repository_dispatch:
    types: [mt5-warm, mt5-job]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        shell: bash
        env:
          MT5_API_URL: ${{ secrets.MT5_API_URL }}
          MT5_WORKER_SECRET: ${{ secrets.MT5_WORKER_SECRET }}
          MT5_MAX_WORKERS: ${{ vars.MT5_MAX_WORKERS || '4' }}
        run: |
          set -euo pipefail
          count=$(curl -fsS -X POST "$MT5_API_URL/v1/worker/ai/accounts"             -H "X-Worker-Secret: $MT5_WORKER_SECRET"             -H 'Content-Type: application/json'             -d '{"shard":0,"shards":1}' | jq -r '.count // 0' || echo 0)
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then count=0; fi
          max=${MT5_MAX_WORKERS:-4}
          if ! [[ "$max" =~ ^[0-9]+$ ]]; then max=4; fi
          if [ "$count" -lt 1 ]; then count=1; fi
          if [ "$count" -gt "$max" ]; then count=$max; fi
          shards=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$count")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "workers=$count"

  warm:
    needs: plan
    concurrency:
      group: mt5-warm-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      PRIMARY_INSTALLER_URL: ${{ secrets.MT5_PRIMARY_INSTALLER_URL }}
      PRIMARY_MATCH: ${{ secrets.MT5_PRIMARY_SERVER_MATCH }}
      ALT_INSTALLER_URL: ${{ secrets.MT5_ALT_INSTALLER_URL }}
      ALT_MATCH: ${{ secrets.MT5_ALT_SERVER_MATCH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache MetaTrader 5 terminal
        id: mt5-cache
        uses: actions/cache@v4
        with:
          path: C:\mt5
          key: mt5-primary-6314

      - name: Install MetaTrader 5
        if: steps.mt5-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (-not $env:PRIMARY_INSTALLER_URL) { throw 'primary installer URL missing' }
          $setup = Join-Path $env:RUNNER_TEMP 'primary5setup.exe'
          Invoke-WebRequest -Uri $env:PRIMARY_INSTALLER_URL -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          $roots = @('C:\Program Files', 'C:\Program Files (x86)', (Join-Path $env:LOCALAPPDATA 'Programs'))
          $src = $null
          for ($i = 0; $i -lt 45 -and -not $src; $i++) {
            $candidates = Get-ChildItem -Path $roots -Recurse -Depth 3 -Filter 'terminal64.exe' -ErrorAction SilentlyContinue
            if ($env:PRIMARY_MATCH) {
              $src = $candidates | Where-Object {
                $origin = Join-Path $_.Directory.FullName 'origin.txt'
                (Test-Path $origin) -and ((Get-Content $origin -Raw -ErrorAction SilentlyContinue) -match [regex]::Escape($env:PRIMARY_MATCH))
              } | Select-Object -First 1
            }
            if (-not $src) {
              $src = $candidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            }
            if (-not $src) { Start-Sleep -Seconds 2 }
          }
          if (-not $src) {
            Get-ChildItem 'C:\Program Files' -Directory | Select-Object -ExpandProperty FullName
            throw 'MetaTrader 5 installation did not produce terminal64.exe'
          }
          $dir = $src.Directory.FullName
          Write-Host "found terminal at $dir"
          New-Item -ItemType Directory -Force -Path 'C:\mt5' | Out-Null
          Copy-Item (Join-Path $dir '*') 'C:\mt5' -Recurse -Force
          Get-Item 'C:\mt5\terminal64.exe' | Select-Object FullName, Length
          Get-Item 'C:\mt5\config\servers.dat' -ErrorAction SilentlyContinue | Select-Object Name, Length
          Get-Content 'C:\mt5\origin.txt' -ErrorAction SilentlyContinue

      - name: Verify terminal
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\mt5\terminal64.exe')) { throw 'C:\mt5\terminal64.exe is missing' }
          python -c "import MetaTrader5 as mt5; print('MetaTrader5', mt5.__version__)"

      - name: Cache alternate MetaTrader 5 terminal
        if: env.ALT_INSTALLER_URL != ''
        continue-on-error: true
        id: mt5-alt-cache
        uses: actions/cache@v4
        with:
          path: C:\mt5b
          key: mt5-alt-6316

      - name: Install alternate MetaTrader 5
        if: env.ALT_INSTALLER_URL != '' && steps.mt5-alt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'alt5setup.exe'
          Invoke-WebRequest -Uri $env:ALT_INSTALLER_URL -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          $roots = @('C:\Program Files', 'C:\Program Files (x86)', (Join-Path $env:LOCALAPPDATA 'Programs'))
          $src = $null
          for ($i = 0; $i -lt 45 -and -not $src; $i++) {
            $candidates = Get-ChildItem -Path $roots -Recurse -Depth 3 -Filter 'terminal64.exe' -ErrorAction SilentlyContinue
            if ($env:ALT_MATCH) {
              $src = $candidates | Where-Object {
                $origin = Join-Path $_.Directory.FullName 'origin.txt'
                (Test-Path $origin) -and ((Get-Content $origin -Raw -ErrorAction SilentlyContinue) -match [regex]::Escape($env:ALT_MATCH))
              } | Select-Object -First 1
            }
            if (-not $src) {
              $src = $candidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            }
            if (-not $src) { Start-Sleep -Seconds 2 }
          }
          if (-not $src) {
            Get-ChildItem 'C:\Program Files' -Directory | Select-Object -ExpandProperty FullName
            throw 'Alternate MetaTrader 5 installation did not produce terminal64.exe'
          }
          $dir = $src.Directory.FullName
          Write-Host "found alternate terminal at $dir"
          New-Item -ItemType Directory -Force -Path 'C:\mt5b' | Out-Null
          Copy-Item (Join-Path $dir '*') 'C:\mt5b' -Recurse -Force
          Get-Item 'C:\mt5b\terminal64.exe' | Select-Object FullName, Length
          Get-Item 'C:\mt5b\config\servers.dat' -ErrorAction SilentlyContinue | Select-Object Name, Length
          Get-Content 'C:\mt5b\origin.txt' -ErrorAction SilentlyContinue

      - name: Verify alternate terminal
        if: env.ALT_INSTALLER_URL != ''
        continue-on-error: true
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\mt5b\terminal64.exe')) { throw 'C:\mt5b\terminal64.exe is missing' }

      - name: Boot MT5 session
        shell: pwsh
        timeout-minutes: 4
        env:
          MT5_API_URL: ${{ secrets.MT5_API_URL }}
          MT5_WORKER_SECRET: ${{ secrets.MT5_WORKER_SECRET }}
          MT5_SHARD: ${{ matrix.shard }}
          MT5_SHARDS: ${{ needs.plan.outputs.count }}
          MT5_TERMINAL_ALT_PATH: 'C:\mt5b\terminal64.exe'
          MT5_TERMINAL_ALT_MATCH: ${{ secrets.MT5_ALT_SERVER_MATCH }}
          MT5_SYMBOL_MAP: ${{ secrets.MT5_SYMBOL_MAP }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python mt5_boot.py

      - name: Run warm worker
        shell: pwsh
        env:
          MT5_API_URL: ${{ secrets.MT5_API_URL }}
          MT5_WORKER_SECRET: ${{ secrets.MT5_WORKER_SECRET }}
          MT5_WORKER_ID: github-${{ github.run_id }}-${{ matrix.shard }}
          MT5_SHARD: ${{ matrix.shard }}
          MT5_SHARDS: ${{ needs.plan.outputs.count }}
          MT5_TERMINAL_ALT_PATH: 'C:\mt5b\terminal64.exe'
          MT5_TERMINAL_ALT_MATCH: ${{ secrets.MT5_ALT_SERVER_MATCH }}
          MT5_SYMBOL_MAP: ${{ secrets.MT5_SYMBOL_MAP }}
          MT5_CONNECT_TIMEOUT_MS: '30000'
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          MT5_DURATION_SECONDS: '20700'
          MT5_SUPABASE_URL: ${{ secrets.MT5_SUPABASE_URL }}
          MT5_SUPABASE_KEY: ${{ secrets.MT5_SUPABASE_KEY }}
          MT5_DRY_RUN: ${{ vars.MT5_DRY_RUN || '0' }}
          MT5_POLL_SECONDS: '1'
          MT5_SNAPSHOT_SECONDS: '1'
          MT5_AI_ENABLED: '1'
          MT5_AI_INTERVAL: '5'
          MT5_AI_SHARD: ${{ matrix.shard }}
          MT5_AI_SHARDS: ${{ needs.plan.outputs.count }}
          MT5_ORDERFLOW: '1'
          KOMZ_ENABLED: '1'
          KOMZ_MODEL: ${{ vars.KOMZ_MODEL || 'nvidia/nemotron-3.5-lightning-30b-a3b' }}
          KOMZ_REASONING: 'low'
          KOMZ_BRAIN_INTERVAL: '90'
          KOMZ_RESEARCH_SECONDS: '900'
          KOMZ_COUNCIL: '1'
          KOMZ_COUNCIL_MODELS: '6'
          KOMZ_COUNCIL_ROUNDS: '2'
          KOMZ_COUNCIL_PROBE: '1'
          KOMZ_NVIDIA_MIN_INTERVAL: '1.5'
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mt5_worker.py

      - name: Chain next warm run
        if: ${{ always() && matrix.shard == 0 && vars.MT5_WARM_ENABLED != 'false' }}
        shell: pwsh
        env:
          MT5_DISPATCH_TOKEN: ${{ secrets.MT5_DISPATCH_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:MT5_DISPATCH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          $body = @{ event_type = 'mt5-warm' } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/dispatches" -Headers $headers -Body $body -ContentType 'application/json'
